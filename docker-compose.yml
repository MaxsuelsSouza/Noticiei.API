# Banco local que imita o Neon (Postgres + proxy HTTP/WebSocket do driver serverless).
# DATABASE_URL=postgres://postgres:postgres@db.localtest.me:5432/noticiei
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: noticiei
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/noticiei
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
